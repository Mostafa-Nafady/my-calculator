<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>ASD Calculator - My Calculator</title>
    <link
      href="https://fonts.googleapis.com/css?family=Roboto:400,700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../assets/styles/app.css" />
    <link rel="stylesheet" href="assets/styles/asd.css" />
    <script src="../assets/scripts/components/Header.js" defer></script>
    <script src="assets/scripts/asd.js" defer></script>
  </head>
  <body>
    <div id="header-container"></div>

    <section id="asd-calculator">
      <h2>ASD Calculator</h2>
      <p>Calculate (A × B) ÷ C</p>
      <div id="asd-inputs">
        <input type="number" id="input-a" placeholder="A" />
        <span id="operator-symbol">×</span>
        <input type="number" id="input-b" placeholder="B" />
        <span id="divide-symbol">÷</span>
        <input type="number" id="input-c" placeholder="C" />
      </div>
      <div id="asd-actions">
        <button type="button" id="btn-calculate">Calculate</button>
        <button type="button" id="btn-clear">Clear</button>
      </div>
    </section>
    <section id="results">
      <h2 id="current-calculation">0</h2>
      <h2>Result: <span id="current-result">0</span></h2>
    </section>
  </body>
</html>
