worker_processes auto;

error_log stderr;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;
  keepalive_timeout 65;

  # Structured JSON access log format with correlation IDs
  log_format json_combined escape=json '{'
    '"timestamp":"$time_iso8601",'
    '"request_id":"$request_id",'
    '"remote_addr":"$remote_addr",'
    '"method":"$request_method",'
    '"uri":"$request_uri",'
    '"status":$status,'
    '"bytes_sent":$body_bytes_sent,'
    '"request_time":$request_time,'
    '"upstream_response_time":"$upstream_response_time",'
    '"referer":"$http_referer",'
    '"user_agent":"$http_user_agent"'
  '}';

  access_log /dev/stdout json_combined;

  server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
      try_files $uri $uri/ =404;
    }

    # Enhanced health endpoint — returns JSON with status, timestamp, and uptime
    location = /health {
      default_type application/json;
      return 200 '{"status":"ok","timestamp":"$time_iso8601","uptime":$connection_requests}';
    }

    # Readiness probe endpoint — returns 200 when nginx is ready to serve traffic
    location = /ready {
      default_type application/json;
      return 200 '{"status":"ready"}';
    }

    # nginx stub_status metrics endpoint — provides active connections,
    # accepts, handled, requests, reading, writing, waiting
    location = /stub_status {
      stub_status;
    }
  }
}


