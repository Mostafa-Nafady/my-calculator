name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write
  security-events: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  # ─────────────────────────────────────────────
  # Job 1: Lint & Validate
  # ─────────────────────────────────────────────
  lint:
    name: Lint & Validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate HTML files
        run: |
          set -e
          echo "Checking all HTML files for DOCTYPE and basic structure..."
          html_files=$(find . -name "*.html" -not -path "./.git/*")
          if [ -z "$html_files" ]; then
            echo "⚠️  No HTML files found."
            exit 1
          fi
          errors=0
          for file in $html_files; do
            echo "Checking: $file"
            if ! grep -qi '<!DOCTYPE html>' "$file"; then
              echo "  ❌ Missing <!DOCTYPE html> declaration"
              errors=$((errors + 1))
            fi
            if ! grep -qi '<html' "$file"; then
              echo "  ❌ Missing <html> tag"
              errors=$((errors + 1))
            fi
            if ! grep -qi '<head>' "$file"; then
              echo "  ❌ Missing <head> tag"
              errors=$((errors + 1))
            fi
            if ! grep -qi '<body>' "$file"; then
              echo "  ❌ Missing <body> tag"
              errors=$((errors + 1))
            fi
            if ! grep -qi '</html>' "$file"; then
              echo "  ❌ Missing closing </html> tag"
              errors=$((errors + 1))
            fi
          done
          if [ "$errors" -gt 0 ]; then
            echo ""
            echo "❌ $errors HTML validation error(s) found."
            exit 1
          fi
          echo ""
          echo "✅ All HTML files passed basic validation."

      - name: Validate Dockerfile exists
        run: |
          if [ ! -f "Dockerfile" ]; then
            echo "❌ Dockerfile not found at repository root."
            exit 1
          fi
          echo "✅ Dockerfile found."

      - name: Validate docker-compose.yml
        run: |
          if [ ! -f "docker-compose.yml" ]; then
            echo "❌ docker-compose.yml not found at repository root."
            exit 1
          fi
          # Use Python to parse YAML since it's pre-installed on ubuntu-latest
          python3 -c "
          import yaml, sys
          with open('docker-compose.yml') as f:
              data = yaml.safe_load(f)
          if 'services' not in data:
              print('❌ docker-compose.yml missing services key')
              sys.exit(1)
          print('✅ docker-compose.yml is valid YAML.')
          "

  # ─────────────────────────────────────────────
  # Job 2: Security Scan
  # ─────────────────────────────────────────────
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy filesystem scan
        continue-on-error: true
        uses: aquasecurity/trivy-action@0.24.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-fs-results.sarif
          severity: CRITICAL,HIGH,MEDIUM,LOW

      - name: Run Trivy config scan (Dockerfile & docker-compose.yml)
        continue-on-error: true
        uses: aquasecurity/trivy-action@0.24.0
        with:
          scan-type: config
          scan-ref: .
          format: sarif
          output: trivy-config-results.sarif
          severity: CRITICAL,HIGH,MEDIUM,LOW

      - name: Upload Trivy filesystem SARIF to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-fs-results.sarif
          category: trivy-filesystem

      - name: Upload Trivy config SARIF to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-config-results.sarif
          category: trivy-config

  # ─────────────────────────────────────────────
  # Job 3: Build & Push Docker Image
  # ─────────────────────────────────────────────
  build-and-push:
    name: Build & Push Docker Image
    needs: [lint, security-scan]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy image scan
        continue-on-error: true
        uses: aquasecurity/trivy-action@0.24.0
        with:
          scan-type: image
          image-ref: ${{ env.IMAGE_NAME }}:latest
          format: sarif
          output: trivy-image-results.sarif
          severity: CRITICAL,HIGH,MEDIUM,LOW

      - name: Upload Trivy image SARIF to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-image-results.sarif
          category: trivy-image

