# CI/CD Pipeline for Static Website (AWS S3 + CloudFront)
#
# ── Supply Chain Security ──────────────────────────────────────────
# All GitHub Actions are pinned to immutable commit SHAs (not mutable
# tags like @v4) to prevent supply-chain attacks via tag re-pointing.
# Dependabot is configured (.github/dependabot.yml) to automatically
# open PRs that bump these SHA pins when new action versions are
# released, keeping pins both secure and up to date.
# ───────────────────────────────────────────────────────────────────
#
# Required GitHub Secrets:
#   S3_BUCKET_NAME             - The name of the S3 bucket for static site hosting
#   CLOUDFRONT_DISTRIBUTION_ID - The CloudFront distribution ID to invalidate
#   AWS_ACCESS_KEY_ID          - AWS access key with S3 and CloudFront permissions
#   AWS_SECRET_ACCESS_KEY      - AWS secret access key
#
# This workflow runs security scans on every push and PR.
# On push to main, it deploys the static site to S3 and invalidates CloudFront.

name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# Default permissions — least privilege; jobs override as needed
permissions:
  contents: read

# Cancel in-progress runs for the same branch/PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────
  # Job 1: Security Scanning
  # ─────────────────────────────────────────────
  security-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@6c175e9c40e053e842d69eee5d51a5c3b8e3b2e1  # v0.28.0
        with:
          scan-type: fs
          scan-ref: .
          args: --severity HIGH,CRITICAL --exit-code 1 --ignore-unfixed .

      - name: Run gitleaks secret scan
        uses: gitleaks/gitleaks-action@82cf09db7b957db6dd2b3613a98d39b2cfb5d56c  # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ─────────────────────────────────────────────
  # Job 2: Docker Build & Push to GHCR
  # Runs on all pushes and PRs to validate the Dockerfile
  # ─────────────────────────────────────────────
  docker-build:
    needs: security-scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36e1a5d5bdcf0  # v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772  # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@263435318d21b8e681c14492fe198571cfb76f00  # v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─────────────────────────────────────────────
  # Job 3: Terraform Validation
  # Runs on all pushes and PRs to validate IaC
  # ─────────────────────────────────────────────
  terraform-validate:
    needs: security-scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@4b2ffb22fdc52d48821530f2007d022cfe1a9646  # v3

      - name: Terraform format check
        run: terraform -chdir=terraform fmt -check -recursive

      - name: Terraform init
        run: terraform -chdir=terraform init -backend=false

      - name: Terraform validate
        run: terraform -chdir=terraform validate

  # ─────────────────────────────────────────────
  # Job 4: Deploy to AWS S3 + CloudFront
  # Only runs on push to main (not on PRs)
  # ─────────────────────────────────────────────
  deploy:
    needs: [security-scan, docker-build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c28e5094233d0c5283  # v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Sync static files to S3
        run: |
          aws s3 sync . s3://${{ secrets.S3_BUCKET_NAME }} \
            --delete \
            --exclude '.git/*' \
            --exclude 'node_modules/*' \
            --exclude '.github/*' \
            --exclude 'offloaded/*' \
            --exclude 'terraform/*' \
            --exclude '.env*'

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths '/*'


