name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write
  packages: write

jobs:
  # ──────────────────────────────────────────────
  # Security Scanning (Trivy filesystem + secrets)
  # ──────────────────────────────────────────────
  security-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          format: sarif
          output: trivy-results.sarif

      - name: Upload Trivy SARIF results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif

      - name: Run Trivy secret scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: secret
          severity: CRITICAL,HIGH

  # ──────────────────────────────────────────────
  # CodeQL Static Analysis (JavaScript)
  # ──────────────────────────────────────────────
  codeql:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript
          config-file: .github/codeql-config.yml

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Analyze
        uses: github/codeql-action/analyze@v3

  # ──────────────────────────────────────────────
  # Docker Build & Push to GHCR
  # ──────────────────────────────────────────────
  docker-build:
    needs: [security-scan, codeql]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ──────────────────────────────────────────────
  # Deploy to Production
  # ──────────────────────────────────────────────
  deploy:
    needs: docker-build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ── Placeholder deploy step ──────────────────────────────────
      # This is environment-specific and should be replaced with
      # actual SSH/deployment commands for your target infrastructure.
      # Examples:
      #   - SSH into EC2 and `docker pull` + `docker compose up -d --force-recreate`
      #   - Trigger an ArgoCD sync
      #   - Deploy to Kubernetes via kubectl/helm
      # ─────────────────────────────────────────────────────────────
      - name: Deploy to production
        run: |
          echo "Deploying to production..."
          echo "Image: ghcr.io/${{ github.repository }}:latest"
          echo "Replace this step with actual SSH/deployment commands."

      - name: Rollback procedure
        run: |
          echo "=== Rollback Procedure ==="
          echo "1. Automated: Health check failure triggers rollback via Docker Compose restart of previous image tag."
          echo "2. Manual:    git revert <commit> && git push origin main (triggers normal pipeline with previous code)."
          echo "3. Emergency: SSH into server and run:"
          echo "     docker pull ghcr.io/${{ github.repository }}:sha-<previous-sha>"
          echo "     docker compose up -d --force-recreate"
          echo "   Then verify: curl http://localhost:8080/health"

