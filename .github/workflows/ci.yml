name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write
  security-events: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  # ─────────────────────────────────────────────
  # Job 1: Lint & Validate
  # ─────────────────────────────────────────────
  lint:
    name: Lint & Validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate HTML files
        run: |
          set -e
          echo "Checking all HTML files for DOCTYPE and basic structure..."
          html_files=$(find . -name "*.html" -not -path "./.git/*")
          if [ -z "$html_files" ]; then
            echo "⚠️  No HTML files found."
            exit 1
          fi
          errors=0
          for file in $html_files; do
            echo "Checking: $file"
            if ! grep -qi '<!DOCTYPE html>' "$file"; then
              echo "  ❌ Missing <!DOCTYPE html> declaration"
              errors=$((errors + 1))
            fi
            if ! grep -qi '<html' "$file"; then
              echo "  ❌ Missing <html> tag"
              errors=$((errors + 1))
            fi
            if ! grep -qi '<head>' "$file"; then
              echo "  ❌ Missing <head> tag"
              errors=$((errors + 1))
            fi
            if ! grep -qi '<body>' "$file"; then
              echo "  ❌ Missing <body> tag"
              errors=$((errors + 1))
            fi
            if ! grep -qi '</html>' "$file"; then
              echo "  ❌ Missing closing </html> tag"
              errors=$((errors + 1))
            fi
          done
          if [ "$errors" -gt 0 ]; then
            echo ""
            echo "❌ $errors HTML validation error(s) found."
            exit 1
          fi
          echo ""
          echo "✅ All HTML files passed basic validation."

      - name: Validate Dockerfile exists
        run: |
          if [ ! -f "Dockerfile" ]; then
            echo "❌ Dockerfile not found at repository root."
            exit 1
          fi
          echo "✅ Dockerfile found."

      - name: Validate docker-compose.yml
        run: |
          if [ ! -f "docker-compose.yml" ]; then
            echo "❌ docker-compose.yml not found at repository root."
            exit 1
          fi
          # Use Python to parse YAML since it's pre-installed on ubuntu-latest
          python3 -c "
          import yaml, sys
          with open('docker-compose.yml') as f:
              data = yaml.safe_load(f)
          if 'services' not in data:
              print('❌ docker-compose.yml missing services key')
              sys.exit(1)
          print('✅ docker-compose.yml is valid YAML.')
          "

  # ─────────────────────────────────────────────
  # Job 2: Test & Validate
  # ─────────────────────────────────────────────
  test:
    name: Test & Validate
    needs: [lint]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate HTML file structure
        run: |
          set -e
          echo "Checking all HTML files for DOCTYPE and basic structure..."
          html_files=$(find . -name "*.html" -not -path "./.git/*")
          if [ -z "$html_files" ]; then
            echo "⚠️  No HTML files found."
            exit 1
          fi
          errors=0
          for file in $html_files; do
            echo "Checking: $file"
            if ! grep -qi '<!DOCTYPE html>' "$file"; then
              echo "  ❌ Missing <!DOCTYPE html> declaration"
              errors=$((errors + 1))
            fi
            if ! grep -qi '<html' "$file"; then
              echo "  ❌ Missing <html> tag"
              errors=$((errors + 1))
            fi
            if ! grep -qi '<head>' "$file"; then
              echo "  ❌ Missing <head> tag"
              errors=$((errors + 1))
            fi
            if ! grep -qi '<body>' "$file"; then
              echo "  ❌ Missing <body> tag"
              errors=$((errors + 1))
            fi
            if ! grep -qi '</html>' "$file"; then
              echo "  ❌ Missing closing </html> tag"
              errors=$((errors + 1))
            fi
          done
          if [ "$errors" -gt 0 ]; then
            echo ""
            echo "❌ $errors HTML validation error(s) found."
            exit 1
          fi
          echo ""
          echo "✅ All HTML files passed basic validation."

      - name: Validate JavaScript syntax
        run: |
          set -e
          echo "Checking JavaScript syntax for all .js files..."
          js_files=$(find . -name "*.js" -not -path "./node_modules/*" -not -path "./.git/*")
          if [ -z "$js_files" ]; then
            echo "⚠️  No JavaScript files found."
            exit 0
          fi
          errors=0
          for file in $js_files; do
            echo "Checking syntax: $file"
            if ! node -c "$file" 2>/dev/null; then
              echo "  ❌ Syntax error in $file"
              node -c "$file" || true
              errors=$((errors + 1))
            fi
          done
          if [ "$errors" -gt 0 ]; then
            echo ""
            echo "❌ $errors JavaScript syntax error(s) found."
            exit 1
          fi
          echo ""
          echo "✅ All JavaScript files passed syntax validation."

      - name: Validate Dockerfile-referenced files exist
        run: |
          set -e
          echo "Validating that all files referenced in the Dockerfile exist..."
          errors=0

          # Check HTML files referenced in Dockerfile COPY command
          html_files="index.html about.html apc.html asd.html cvxz.html nnn.html qwe.html sdssa.html"
          for file in $html_files; do
            if [ ! -f "$file" ]; then
              echo "  ❌ Missing file: $file"
              errors=$((errors + 1))
            else
              echo "  ✅ Found: $file"
            fi
          done

          # Check subdirectories referenced in Dockerfile COPY command
          subdirs="basics-10-function-refactoring/ uyt/ xpy/"
          for dir in $subdirs; do
            if [ ! -d "$dir" ]; then
              echo "  ❌ Missing directory: $dir"
              errors=$((errors + 1))
            else
              echo "  ✅ Found: $dir"
            fi
          done

          # Check assets directory
          if [ ! -d "assets/" ]; then
            echo "  ❌ Missing directory: assets/"
            errors=$((errors + 1))
          else
            echo "  ✅ Found: assets/"
          fi

          # Check nginx.conf
          if [ ! -f "nginx.conf" ]; then
            echo "  ❌ Missing file: nginx.conf"
            errors=$((errors + 1))
          else
            echo "  ✅ Found: nginx.conf"
          fi

          if [ "$errors" -gt 0 ]; then
            echo ""
            echo "❌ $errors missing file(s)/directory(ies) referenced in Dockerfile."
            exit 1
          fi
          echo ""
          echo "✅ All Dockerfile-referenced files and directories exist."

      - name: Validate nginx.conf syntax
        run: |
          echo "Validating nginx.conf syntax..."
          if command -v nginx &>/dev/null; then
            if nginx -t -c nginx.conf 2>&1; then
              echo "✅ nginx.conf syntax is valid."
            else
              echo "❌ nginx.conf has syntax errors."
              exit 1
            fi
          else
            echo "⚠️  nginx is not installed on the runner — skipping nginx.conf syntax validation."
          fi

  # ─────────────────────────────────────────────
  # Job 3: Security Scan
  # ─────────────────────────────────────────────
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy filesystem scan
        continue-on-error: true
        uses: aquasecurity/trivy-action@0.24.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-fs-results.sarif
          severity: CRITICAL,HIGH,MEDIUM,LOW

      - name: Run Trivy config scan (Dockerfile & docker-compose.yml)
        continue-on-error: true
        uses: aquasecurity/trivy-action@0.24.0
        with:
          scan-type: config
          scan-ref: .
          format: sarif
          output: trivy-config-results.sarif
          severity: CRITICAL,HIGH,MEDIUM,LOW

      - name: Upload Trivy filesystem SARIF to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-fs-results.sarif
          category: trivy-filesystem

      - name: Upload Trivy config SARIF to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-config-results.sarif
          category: trivy-config

  # ─────────────────────────────────────────────
  # Job 4: Build & Push Docker Image
  # ─────────────────────────────────────────────
  build-and-push:
    name: Build & Push Docker Image
    needs: [lint, test, security-scan]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy image scan
        continue-on-error: true
        uses: aquasecurity/trivy-action@0.24.0
        with:
          scan-type: image
          image-ref: ${{ env.IMAGE_NAME }}:latest
          format: sarif
          output: trivy-image-results.sarif
          severity: CRITICAL,HIGH,MEDIUM,LOW

      - name: Upload Trivy image SARIF to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-image-results.sarif
          category: trivy-image

  # ─────────────────────────────────────────────
  # Job 5: Deploy
  # ─────────────────────────────────────────────
  deploy:
    name: Deploy
    needs: [build-and-push]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull the latest image from GHCR
        run: docker pull ${{ env.IMAGE_NAME }}:latest

      - name: Deploy with Docker Compose
        run: |
          # Remove any existing container first
          docker rm -f my-calculator-web || true

          # Run the pulled image with security hardening (matching docker-compose.yml settings)
          docker run -d \
            --name my-calculator-web \
            -p 8080:80 \
            --read-only \
            --tmpfs /tmp \
            --tmpfs /var/cache/nginx \
            --tmpfs /var/run \
            --security-opt no-new-privileges:true \
            --restart unless-stopped \
            ${{ env.IMAGE_NAME }}:latest

      - name: Wait for health check
        run: |
          timeout 30 bash -c 'until curl -sf http://localhost:8080/ > /dev/null 2>&1; do sleep 2; done' \
            || (echo "❌ Health check failed" && docker logs my-calculator-web && exit 1)

      - name: Verify deployment
        run: |
          curl -sf http://localhost:8080/ | grep -qi '<!DOCTYPE html>' \
            && echo "✅ Deployment verified — site is serving HTML" \
            || (echo "❌ Deployment verification failed" && exit 1)

      - name: Print deployment summary
        run: |
          echo "============================================"
          echo "  🚀 Deployment Summary"
          echo "============================================"
          echo "  Image:    ${{ env.IMAGE_NAME }}:latest"
          echo "  Commit:   ${{ github.sha }}"
          echo "  Branch:   ${{ github.ref_name }}"
          echo "  Status:   $(docker ps --filter name=my-calculator-web --format '{{.Status}}')"
          echo "============================================"

      - name: Cleanup
        if: always()
        run: |
          docker rm -f my-calculator-web || true
          docker rmi ${{ env.IMAGE_NAME }}:latest || true



