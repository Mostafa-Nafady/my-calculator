# CodeQL Analysis — SAST scanning for JavaScript
# Runs on every push/PR to main and weekly on Sunday at 00:00 UTC
name: CodeQL Analysis

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly scan every Sunday at 00:00 UTC
    - cron: '0 0 * * 0'

# Least-privilege permissions:
#   contents: read         — checkout source code
#   security-events: write — upload CodeQL analysis results to GitHub Security
permissions:
  contents: read
  security-events: write

# Cancel in-progress runs for the same branch/PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript
          queries: security-and-quality

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: '/language:javascript'


