# ------------------------------------------------------------------------------
# CodeQL Static Analysis for my-calculator
# ------------------------------------------------------------------------------
# Runs GitHub's CodeQL semantic code analysis on push and pull requests.
# Detects security vulnerabilities (XSS, injection, path traversal, etc.)
# in JavaScript/TypeScript code and uploads results to GitHub Security tab.
# ------------------------------------------------------------------------------

name: "CodeQL Analysis"

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  schedule:
    # Run weekly on Sunday at 00:00 UTC
    - cron: '0 0 * * 0'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        language: ['javascript']

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Initialize CodeQL
        uses: github/codeql-action/init@9887d98ae49f1f598651b556d8c8f02f3ea065cb # v3.27.0
        with:
          languages: ${{ matrix.language }}
          # Use the default query suite for security analysis
          queries: security-extended

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@9887d98ae49f1f598651b556d8c8f02f3ea065cb # v3.27.0
        with:
          category: "/language:${{ matrix.language }}"

