<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>ASE Calculator - My Calculator</title>
    <link
      href="https://fonts.googleapis.com/css?family=Roboto:400,700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../assets/styles/app.css" />
    <link rel="stylesheet" href="assets/styles/ase.css" />
    <script src="../assets/scripts/components/Header.js" defer></script>
    <script src="assets/scripts/ase.js" defer></script>
  </head>
  <body>
    <div id="header-container"></div>

    <section id="ase-calculator">
      <h2>ASE Calculator</h2>
      <p>Calculate A + S × E</p>
      <div id="ase-inputs">
        <input type="number" id="input-a" placeholder="A" />
        <span id="operator-plus">+</span>
        <input type="number" id="input-s" placeholder="S" />
        <span id="operator-multiply">×</span>
        <input type="number" id="input-e" placeholder="E" />
      </div>
      <div id="ase-actions">
        <button type="button" id="btn-calculate">Calculate</button>
        <button type="button" id="btn-clear">Clear</button>
      </div>
    </section>
    <section id="results">
      <h2 id="current-calculation">0</h2>
      <h2>Result: <span id="current-result">0</span></h2>
    </section>
  </body>
</html>
