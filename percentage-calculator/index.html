<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>Percentage Calculator - My Calculator</title>
    <link
      href="https://fonts.googleapis.com/css?family=Roboto:400,700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../assets/styles/app.css" />
    <link rel="stylesheet" href="assets/styles/percentage.css" />
    <script src="../assets/scripts/components/Header.js" defer></script>
    <script src="assets/scripts/percentage.js" defer></script>
  </head>
  <body>
    <div id="header-container"></div>

    <section id="percentage-calculator">
      <h2>Percentage Calculator</h2>
      <p>Calculate the percentage of a value</p>
      <div id="percentage-inputs">
        <input type="number" id="input-value" placeholder="Value" />
        <span id="percentage-symbol">%</span>
        <span id="of-text">of</span>
        <input type="number" id="input-total" placeholder="Total" />
      </div>
      <div id="percentage-actions">
        <button type="button" id="btn-calculate">Calculate</button>
        <button type="button" id="btn-clear">Clear</button>
      </div>
    </section>
    <section id="results">
      <h2 id="current-calculation">0</h2>
      <h2>Result: <span id="current-result">0</span></h2>
    </section>
  </body>
</html>
