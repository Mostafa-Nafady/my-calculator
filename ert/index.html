<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>ERT Calculator - My Calculator</title>
    <link href="https://fonts.googleapis.com/css?family=Roboto:400,700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="../assets/styles/app.css" />
    <link rel="stylesheet" href="assets/styles/ert.css" />
    <script src="../assets/scripts/components/Header.js" defer></script>
    <script src="assets/scripts/ert.js" defer></script>
  </head>
  <body>
    <div id="header-container"></div>
    <section id="ert-calculator">
      <h2>ERT (Expected Recovery Time) Calculator</h2>
      <p>Calculate expected recovery time based on parameters</p>
      <div id="ert-inputs">
        <input type="number" id="input-complexity" placeholder="Task Complexity" />
        <input type="number" id="input-team-size" placeholder="Team Size" />
        <input type="number" id="input-risk" placeholder="Risk Factor (0-1)" step="0.1" />
      </div>
      <div id="ert-actions">
        <button type="button" id="btn-calculate">Calculate</button>
        <button type="button" id="btn-clear">Clear</button>
      </div>
    </section>
    <section id="results">
      <h2 id="current-calculation">0</h2>
      <h2>Result: <span id="current-result">0</span></h2>
    </section>
  </body>
</html>
