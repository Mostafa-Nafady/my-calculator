# ---------- docker-compose.yml for my-calculator ----------
# Static website served by nginx on port 8080.

services:
  calculator-web:
    build:
      context: .
      dockerfile: Dockerfile
    image: my-calculator:latest
    container_name: calculator-web
    ports:
      - "8080:8080"
    environment:
      - NODE_ENV=production
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
        reservations:
          memory: 64M
          cpus: "0.1"
    volumes:
      - ./logs:/var/log/nginx

networks:
  default:
    driver: bridge

