services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: my-calculator
    ports:
      - "8080:8080"
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      # Mount the project directory read-only for live editing during development.
      # In production, remove this volume to use the files baked into the image.
      - ./:/usr/share/nginx/html:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

