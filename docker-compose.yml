services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: my-calculator
    ports:
      - "8080:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:80/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
    volumes:
      - nginx_logs:/var/log/nginx

volumes:
  nginx_logs:

