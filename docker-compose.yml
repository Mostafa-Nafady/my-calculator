# ---------- docker-compose.yml for my-calculator ----------
# Development-optimized: live volume mounts reflect local file changes
# immediately in the running container without rebuild.

services:
  calculator-web:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    image: my-calculator:latest
    container_name: calculator-web
    user: "nginx"
    ports:
      - "8080:8080"
    volumes:
      # Live development: mount local source so file changes are reflected immediately
      - ./:/usr/share/nginx/html/
      # Mount nginx config as read-only
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    tmpfs:
      - /var/cache/nginx:uid=101,gid=101,mode=1777
      - /tmp:uid=101,gid=101,mode=1777
      - /var/log/nginx:uid=101,gid=101,mode=1777
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_swappiness: 0
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
          pids: 100
        reservations:
          memory: 64M
          cpus: "0.1"

networks:
  default:
    driver: bridge






