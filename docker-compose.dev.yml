services:
  dev:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    image: my-calculator:dev
    container_name: my-calculator-dev
    ports:
      - "4321:4321"
    restart: unless-stopped
    environment:
      - NODE_ENV=development
    volumes:
      - .:/app
      - /app/node_modules
    command: npm run dev -- --host 0.0.0.0
    networks:
      - default

networks:
  default:
    driver: bridge

