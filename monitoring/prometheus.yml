global:
  scrape_interval: 30s
  evaluation_interval: 30s

scrape_configs:
  - job_name: 'my-calculator-health'
    metrics_path: /health
    static_configs:
      - targets: ['web:8080']

  - job_name: 'nginx-exporter'
    metrics_path: /metrics
    static_configs:
      - targets: ['nginx-exporter:9113']

  - job_name: 'prometheus'
    metrics_path: /metrics
    static_configs:
      - targets: ['localhost:9090']

rule_files:
  - alerts.yml


