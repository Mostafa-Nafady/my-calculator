global:
  scrape_interval: 30s
  evaluation_interval: 30s

scrape_configs:
  - job_name: 'my-calculator'
    metrics_path: /health
    static_configs:
      - targets: ['web:8080']

  - job_name: 'nginx-stub'
    metrics_path: /stub_status
    static_configs:
      - targets: ['web:8080']

rule_files:
  - alerts.yml

