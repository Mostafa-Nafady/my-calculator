groups:
  - name: my-calculator-alerts
    rules:
      - alert: SiteDown
        expr: up{job="my-calculator"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "My Calculator site is down"
          description: "The health check for {{ $labels.instance }} has been failing for 2 minutes."

      - alert: HighResponseTime
        expr: histogram_quantile(0.95, rate(http_request_duration_seconds_bucket[5m])) > 2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High response time detected"
          description: "95th percentile response time is above 2 seconds for 5 minutes."

