groups:
  - name: my-calculator-alerts
    rules:
      - alert: SiteDown
        expr: up{job="my-calculator-health"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "My Calculator site is down"
          description: "The health check for {{ $labels.instance }} has been failing for 2 minutes."

      - alert: HighResponseTime
        expr: histogram_quantile(0.95, rate(http_request_duration_seconds_bucket[5m])) > 2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High response time detected"
          description: "95th percentile response time is above 2 seconds for 5 minutes."

      - alert: NginxExporterDown
        expr: up{job="nginx-exporter"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Nginx Prometheus exporter is down"
          description: "The nginx Prometheus exporter for {{ $labels.instance }} has been down for 2 minutes."

      - alert: HighErrorRate
        expr: rate(nginx_http_requests_total{status=~"5.."}[5m]) / rate(nginx_http_requests_total[5m]) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High 5xx error rate detected"
          description: "5xx error rate is above 5% for 5 minutes on {{ $labels.instance }}."

      - alert: HighActiveConnections
        expr: nginx_connections_active > 100
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High active connections"
          description: "Active nginx connections are above 100 for 5 minutes on {{ $labels.instance }}."

      - alert: PrometheusDown
        expr: up{job="prometheus"} == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Prometheus is down"
          description: "Prometheus has been down for 5 minutes."

      - alert: NginxHighRequestRate
        expr: rate(nginx_http_requests_total[5m]) > 100
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High request rate detected"
          description: "Request rate is above 100 req/s for 5 minutes on {{ $labels.instance }}."


