<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>AWE Calculator - My Calculator</title>
    <link
      href="https://fonts.googleapis.com/css?family=Roboto:400,700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../assets/styles/app.css" />
    <link rel="stylesheet" href="assets/styles/awe.css" />
    <script src="../assets/scripts/components/Header.js" defer></script>
    <script src="assets/scripts/awe.js" defer></script>
  </head>
  <body>
    <div id="header-container"></div>

    <section id="awe-calculator">
      <h2>AWE Calculator</h2>
      <p>Calculate AWE (Average Weighted something)</p>
      <div id="awe-inputs">
        <input type="number" id="input-value-a" placeholder="Value A" />
        <span id="operator-symbol">+</span>
        <input type="number" id="input-value-b" placeholder="Value B" />
      </div>
      <div id="awe-actions">
        <button type="button" id="btn-calculate">Calculate</button>
        <button type="button" id="btn-clear">Clear</button>
      </div>
    </section>
    <section id="results">
      <h2 id="current-calculation">0</h2>
      <h2>Result: <span id="current-result">0</span></h2>
    </section>
  </body>
</html>
