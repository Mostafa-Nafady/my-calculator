<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>ZZZ - My Calculator</title>
    <link
      href="https://fonts.googleapis.com/css?family=Roboto:400,700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="assets/styles/app.css" />
    <link rel="stylesheet" href="assets/styles/zzz.css" />
    <script src="assets/scripts/components/Header.js" defer></script>
    <script src="assets/scripts/zzz.js" defer></script>
  </head>
  <body>
    <div id="header-container"></div>

    <section id="zzz-content">
      <h2>ZZZ Calculator</h2>
      <p>
        The ZZZ calculator performs a simple calculation using two numbers.
        Enter your values below and press Calculate to see the result.
      </p>
    </section>

    <section id="calculator">
      <input id="input1" type="number" placeholder="Enter first number" />
      <input id="input2" type="number" placeholder="Enter second number" />
      <div id="calc-actions">
        <button id="btn-calc">Calculate</button>
      </div>
      <div id="results"></div>
    </section>
  </body>
</html>
