<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>UIY Calculator - My Calculator</title>
  <link
      href="https://fonts.googleapis.com/css?family=Roboto:400,700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="assets/styles/uiy.css" />
    <script src="assets/scripts/vendor.js" defer></script>
    <script src="assets/scripts/components/Header.js" defer></script>
    <script src="assets/scripts/uiy.js" defer></script>
  </head>
  <body>
    <div id="header-container"></div>

    <section id="uyt-calculator">
      <h2>UIY Calculator</h2>
      <p>Enter two numbers and choose to multiply or divide them.</p>
      <div id="uyt-inputs">
        <input type="number" id="input-y1" placeholder="Y1" />
        <span id="multiply-symbol">×</span>
        <input type="number" id="input-y2" placeholder="Y2" />
        <span id="divide-symbol">÷</span>
      </div>
      <div id="uyt-actions">
        <button type="button" id="btn-multiply">Multiply</button>
        <button type="button" id="btn-divide">Divide</button>
        <button type="button" id="btn-clear">Clear</button>
      </div>
    </section>
    <section id="results">
      <h2 id="current-calculation">0</h2>
      <h2>Result: <span id="current-result">0</span></h2>
    </section>
  </body>
</html>
