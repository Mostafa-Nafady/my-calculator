---
# HorizontalPodAutoscaler for my-calculator.
#
# Scales the deployment between 2 and 6 replicas based on CPU and memory
# utilization. The static site is lightweight, but autoscaling handles
# traffic spikes gracefully.
#
# CPU target 70%: scale up before pods hit CPU limits (which causes
#   throttling and latency).
# Memory target 80%: scale up before pods approach the 256Mi limit
#   (which causes OOMKills).
#
# scaleDown stabilizationWindowSeconds: 60 — wait 1 minute of low
# utilization before scaling down to avoid flapping.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: my-calculator
  namespace: my-calculator
  labels:
    app.kubernetes.io/name: my-calculator
    app.kubernetes.io/part-of: my-calculator
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: my-calculator
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 60
      policies:
        - type: Percent
          value: 25
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60

