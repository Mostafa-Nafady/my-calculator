<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>AQPO Calculator - My Calculator</title>
    <link
      href="https://fonts.googleapis.com/css?family=Roboto:400,700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../assets/styles/app.css" />
    <link rel="stylesheet" href="assets/styles/aqpo.css" />
    <script src="../assets/scripts/components/Header.js" defer></script>
    <script src="assets/scripts/aqpo.js" defer></script>
  </head>
  <body>
    <div id="header-container"></div>

    <section id="aqpo-calculator">
      <h2>AQPO Calculator</h2>
      <p>Calculate A multiplied by Q plus O</p>
      <div id="aqpo-inputs">
        <input type="number" id="input-a" placeholder="Value (A)" />
        <span id="operator-symbol">*</span>
        <input type="number" id="input-q" placeholder="Value (Q)" />
        <span id="plus-symbol">+</span>
        <input type="number" id="input-o" placeholder="Value (O)" />
      </div>
      <div id="aqpo-actions">
        <button type="button" id="btn-calculate">Calculate</button>
        <button type="button" id="btn-clear">Clear</button>
      </div>
    </section>
    <section id="results">
      <h2 id="current-calculation">0</h2>
      <h2>Result: <span id="current-result">0</span></h2>
    </section>
  </body>
</html>
